spring.application.name=mydbtest
spring.threads.virtual.enabled=true

# R2DBC (Reativo com Pool padrao)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=developer
spring.r2dbc.pool.enabled=true

# Flyway (Bootstrap via JDBC com bypass de versao para PostgreSQL 18)
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=developer
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-unsupported-database=true
