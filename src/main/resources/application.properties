spring.application.name=card-receivables-engine
spring.threads.virtual.enabled=true

# R2DBC (Reativo com Pool padrao)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=developer
spring.r2dbc.pool.enabled=true

# Flyway (Bootstrap via JDBC com bypass de versao para PostgreSQL 18)
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=developer
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-unsupported-database=true

# OpenAPI / Swagger UI (WebFlux)
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

